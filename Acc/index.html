<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Plays</title>
		<link href="./main.css" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600&display=swap" rel="stylesheet" />

		<!-- This is a development version of Vue.js -->
		<script src="https://unpkg.com/vue@3.0.0/dist/vue.global.js"></script>
		<script src="/lib/reconnecting-websocket.js"></script>
		<script src="/lib/consts.js"></script>
		<script src="/lib/utils.js"></script>
	</head>

	<body>
		<div id="app" v-cloak>
			<div class="item big center grade" :class="currentStatus">
				<span class="label">hạng</span>
				<span class="value" :class="gradeStyle">{{grade}}</span>

				<span class="progBar">
					<span id="accBarCurrent" class="bar orange"></span>
					<span id="accBarReal" class="bar blue"></span>
				</span>

				<span class="deltaBar t5">
					<span id="accBarLeft" class="left"></span>
					<span id="accBarRight" class="right"></span>
					<span class="label c">0</span>
					<span class="label l">-0.5%</span>
					<span class="label r">+0.5%</span>
				</span>

				<div class="space large"></div>
				<span class="right">{{realAcc}}% / {{accValue}}%</span>
			</div>
		</div>
		<script src="./main.js" type="module"></script>
	</body>
</html>
