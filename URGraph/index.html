<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Plays</title>
		<link href="./main.css" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600&display=swap" rel="stylesheet" />

		<!-- This is a development version of Vue.js -->
		<script src="https://unpkg.com/vue@3.0.0/dist/vue.global.js"></script>
		<script src="/lib/reconnecting-websocket.js"></script>
		<script src="/lib/consts.js"></script>
		<script src="/lib/utils.js"></script>
	</head>

	<body>
		<div id="app" v-cloak>
			<div id="unstableRate" class="item" :class="unstableStyle,currentStatus">
				<span class="label">độ bất ổn định</span>
				<span class="value">{{getToken('unstableRate', 2)}}</span>

				<div id="hitErrorChart">
					<div class="bars"></div>
					<div class="hints"></div>
					<div class="debugs">
						<span class="ms">---</span>
						<span class="delta">Δ 0</span>
						<span class="updates">U 0</span>
						<span class="index">I 0</span>
						<span class="step">0 STP</span>
						<span class="max">0 MAX</span>
					</div>
				</div>
			</div>
		</div>
		
		<script src="./main.js" type="module"></script>
	</body>
</html>
