<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Heart Graph</title>

		<link href="style.css" rel="stylesheet" />
	</head>
	
	<body>
		<div id="bpm">
			<div class="top">
				<img id="heart" src="heart.svg">
				<div id="value">---</div>
			</div>

			<div id="graph">
				<div class="line maxLine"></div>
				<div class="line realMaxLine"></div>
				<div class="lines"></div>

				<div class="values">
					<span class="max">--</span>
					<span class="realMax">--</span>
					<span class="min">--</span>
					<span class="current">--</span>
				</div>

				<div class="times"></div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
